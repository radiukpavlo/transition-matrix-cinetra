label_tables:
  Y_acdc:
    endpoint: Y_acdc_class
    source: "ACDC Info.cfg Group"
    classes:
      DCM: "dilated cardiomyopathy"
      HCM: "hypertrophic cardiomyopathy"
      MINF: "previous myocardial infarction"
      NOR: "normal subjects"
      RV: "abnormal right ventricle"
    counts: {acdc_dev: {DCM: 20, HCM: 20, MINF: 19, NOR: 19, RV: 20}, acdc_test: {DCM: 10, HCM: 10, MINF: 10, NOR: 10, RV: 10}}   # acdc_dev without patient055 (MINF) and patient076 (NOR): declared duplicate images (amendments 2026-09-28)
    role: "consequent vocabulary of every rulebook (Decision D8); dataset label, not diagnosis"
  d_model:
    endpoint: d_model
    definition: "argmax class of the frozen multinomial logistic regression on standardized formal A (configs/formal.yaml audited_predictor; Decision D5); ties broken by the fixed class order DCM, HCM, MINF, NOR, RV"
    role: "audited decision and consequent of the primary rulebook; model decision, not diagnosis"
  mms_to_acdc:
    endpoint: Y_mms_crosswalk
    source: "M&Ms information CSV Pathology"
    decision: D8
    crosswalk:
      NOR: {acdc: NOR, compatibility: HARMONIZABLE_SAME_DEFINITION}
      DCM: {acdc: DCM, compatibility: HARMONIZABLE_SAME_DEFINITION}
      HCM: {acdc: HCM, compatibility: HARMONIZABLE_SAME_DEFINITION}
      ARV: {acdc: RV, compatibility: HARMONIZABLE_SAME_DEFINITION, note: "binding D8; ACDC RV is the broader abnormal-RV category"}
      IHD: {acdc: MINF, compatibility: HARMONIZABLE_NOT_EXACT, reason_code: REFERENCE_NOT_EXACT_IHD_MINF, note: "reported separately; never pooled into crosswalk-evaluable accuracy"}
      HHD: {acdc: null, compatibility: OFF_ONTOLOGY, reason_code: REFERENCE_OFF_ONTOLOGY}
      LVNC: {acdc: null, compatibility: OFF_ONTOLOGY, reason_code: REFERENCE_OFF_ONTOLOGY}
      AHS: {acdc: null, compatibility: OFF_ONTOLOGY, reason_code: REFERENCE_OFF_ONTOLOGY}
      Other: {acdc: null, compatibility: OFF_ONTOLOGY, reason_code: REFERENCE_OFF_ONTOLOGY}
    counts_mms_external: {crosswalk_evaluable: 273, ihd_not_exact: 4, off_ontology: 43, total: 320}
    off_ontology_reporting: "route distribution only; no external accuracy"
